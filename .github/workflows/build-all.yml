name: build-all

on:
  push:
    branches: [ ignition-2027 ]
  pull_request:
    branches: [ ignition-2027 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs the JDK and Maven pinned in mise.toml, so CI builds with the same tools as developers.
      - name: Set up tools from mise.toml
        uses: jdx/mise-action@v5

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Make build script executable
        run: chmod +x build-all.sh

      - name: Run build-all.sh
        run: ./build-all.sh
